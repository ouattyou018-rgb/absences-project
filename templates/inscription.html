<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AbsenceTrack - Inscription</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .bg-glow{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(108,99,255,0.15) 0%,transparent 70%);top:-100px;right:-100px;pointer-events:none;}
    .bg-glow2{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(16,217,160,0.08) 0%,transparent 70%);bottom:-50px;left:-50px;pointer-events:none;}
    .wrapper{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:24px;}
    .box{background:rgba(18,18,26,0.9);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:40px;width:100%;max-width:440px;backdrop-filter:blur(20px);position:relative;z-index:1;}
    .box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#10d9a0,transparent);border-radius:20px 20px 0 0;}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
    .logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#6c63ff,#a78bfa);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 0 24px rgba(108,99,255,0.4);}
    .logo-text{font-size:1.1rem;font-weight:700;color:#f0f0ff;}
    .logo-sub{font-size:0.65rem;color:#8888aa;text-transform:uppercase;letter-spacing:1px;}
    h1{font-size:1.4rem;font-weight:800;color:#f0fff4;letter-spacing:-0.5px;margin-bottom:4px;}
    .subtitle{font-size:0.875rem;color:#8888aa;margin-bottom:24px;}
    .alert{padding:11px 14px;border-radius:10px;font-size:0.85rem;margin-bottom:16px;font-weight:500;}
    .alert-danger{background:rgba(255,77,109,0.1);color:#ff4d6d;border:1px solid rgba(255,77,109,0.25);}
    .alert-success{background:rgba(16,217,160,0.1);color:#10d9a0;border:1px solid rgba(16,217,160,0.25);}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:0.8rem;font-weight:500;color:#8888aa;margin-bottom:7px;}
    .field input{width:100%;padding:11px 14px;background:rgba(26,26,40,0.8);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#f0f0ff;font-size:0.9rem;outline:none;transition:all 0.2s;font-family:'Inter',sans-serif;}
    .field input:focus{border-color:#6c63ff;box-shadow:0 0 0 3px rgba(108,99,255,0.15);}
    .hint{font-size:0.72rem;color:#8888aa;margin-top:5px;}
    .btn{width:100%;padding:12px;background:linear-gradient(135deg,#6c63ff,#8b5cf6);color:white;border:none;border-radius:10px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;box-shadow:0 0 24px rgba(108,99,255,0.3);margin-top:6px;}
    .btn:hover{box-shadow:0 0 36px rgba(108,99,255,0.5);transform:translateY(-1px);}
    .divider{display:flex;align-items:center;gap:12px;margin:18px 0;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08);}
    .divider span{font-size:0.75rem;color:#8888aa;}
    .login-link{display:block;padding:11px;background:rgba(255,255,255,0.04);color:#8888aa;border:1px solid rgba(255,255,255,0.08);border-radius:10px;text-decoration:none;font-size:0.875rem;font-weight:500;transition:all 0.2s;text-align:center;}
    .login-link:hover{background:rgba(255,255,255,0.08);color:#f0f0ff;}
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow2"></div>
  <div class="wrapper">
    <div class="box">
      <div class="logo">
        <div class="logo-icon">📊</div>
        <div>
          <div class="logo-text">AbsenceTrack</div>
          <div class="logo-sub">Gestion scolaire</div>
        </div>
      </div>
      <h1>Creer un compte ✨</h1>
      <p class="subtitle">Rejoignez AbsenceTrack et gerez vos absences</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="field">
          <label>Nom complet</label>
          <input type="text" name="nom" placeholder="Ex: Ouattara Seydou" required>
        </div>
        <div class="field">
          <label>Adresse email</label>
          <input type="email" name="email" placeholder="votre@email.com" required>
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" name="mot_de_passe" placeholder="••••••••" required>
          <p class="hint">Au moins 6 caracteres</p>
        </div>
        <div class="field">
          <label>Confirmer le mot de passe</label>
          <input type="password" name="confirmer" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Creer mon compte</button>
      </form>
      <div class="divider"><span>deja inscrit ?</span></div>
      <a href="{{ url_for('login') }}" class="login-link">Se connecter</a>
    </div>
  </div>
</body>
</html>
